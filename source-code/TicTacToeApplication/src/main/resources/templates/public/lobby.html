<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lobby</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="card">
        <h2>Salas</h2>

        <div class="create">
            <input id="roomName" placeholder="Nome da sala">
            <button id="create">Criar sala</button>
            <button id="refresh" class="secondary">Atualizar</button>
        </div>

        <div id="rooms"></div>

        <div id="currentRoom" style="display:none">
            <h3 id="roomTitle"></h3>
            <ul id="players"></ul>
            <div class="actions">
                <button id="ready">Pronto</button>
                <button id="start" disabled>Iniciar</button>
            </div>
            <button id="leave" class="secondary">Sair da sala</button>
        </div>

        <p><a id="logout">Sair</a></p>
    </div>
</body>

<script src="./lib/jquery-4.0.0.min.js"></script>

<script>
    $(document).ready(function () {
        const proto = location.protocol === "https:" ? "wss://" : "ws://";

        const token = document.cookie
            .split("; ")
            .find(c => c.startsWith("accessToken="))
            ?.split("=")[1];

        const ws = new WebSocket(
            proto + location.host + "/ws?accessToken=" + encodeURIComponent(token)
        );

        const send = (event, content) => ws.send(JSON.stringify(content ? {event, content} : {event}));

        ws.onopen = () => send("global.rooms.by.status", {status: "WAITING"});

        ws.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            switch (msg.event) {
                case "global.rooms.by.status": renderRooms(msg.content.rooms); break;
                case "room.create":
                case "room.join":
                case "room.ready":
                case "room.leave":
                    send("room.info");               // sempre re-sincroniza
                    send("global.rooms.by.status", {status: "WAITING"});
                    break;
                case "room.info": renderRoom(msg.content); break;
                case "room.game.start":
                    location.href = "game.html";
                    break;
                default: console.log(msg);
            }
        };

        function renderRooms(rooms) {
            $("#rooms").html(rooms.map(r => `
                <div class="room">
                    <span>${$("<i>").text(r.name).html()} (${r.currentPlayer}/${r.maxPlayers})</span>
                    <button class="join" data-id="${r.id}">Entrar</button>
                </div>`)
            .join(""));
        }

        function renderRoom(room) {
            if (!room || !room.id) { $("#currentRoom").hide(); return; }
            $("#currentRoom").show();
            $("#roomTitle").text(room.name);
            $("#players").html(room.players.map(p =>
                `<li>${$("<i>").text(p.username).html()} ${p.ready ? "✔" : "…"}</li>`).join(""));
            const allReady = room.players.length >= 2 && room.players.every(p => p.ready);
            $("#start").prop("disabled", !allReady);
        }

        $("#create").click(() => send("room.create", {name: $("#roomName").val()}));
        $("#refresh").click(() => send("global.rooms.by.status", {status: "WAITING"}));
        $("#rooms").on("click", ".join", function () { send("room.join", {roomId: $(this).data("id")}); });
        $("#ready").click(() => send("room.ready"));
        $("#start").click(() => send("room.game.start"));
        $("#leave").click(() => send("room.leave"));
    });
</script>

</html>
