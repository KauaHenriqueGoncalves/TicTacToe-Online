<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jogo da Velha</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="card">
        <h2 id="title">Entrar</h2>
        <form id="form">
            <input id="username" placeholder="Usuário" style="display:none">
            <input id="email" type="email" placeholder="Email" required>
            <input id="password" type="password" placeholder="Senha" required>
            <button type="submit">Enviar</button>
        </form>
        <div class="msg" id="msg"></div>
        <p><a id="toggle">Criar conta</a></p>
    </div>
</body>

<script src="./lib/jquery-4.0.0.min.js"></script>

<script>
    $(document).ready(function() {
        const API = "/api/v1/auth";
        let register = false;

        $("#toggle").click(function () {
            register = !register;
            $("#username").toggle(register);
            $("#title").text(register ? "Cadastrar" : "Entrar");
            $(this).text(register ? "Já tenho conta" : "Criar conta");
            $("#msg").text("");
        });

        function login() {
            $.ajax({
                url: API + "/login", method: "POST", contentType: "application/json",
                data: JSON.stringify({email: $("#email").val(), password: $("#password").val()}),
                success: () => location.href = "/lobby.html",
                error: x => $("#msg").text(x.responseJSON?.message || "Erro ao entrar")
            });
        }

        $("#form").submit(function (e) {
            e.preventDefault();
            if (!register) return login();
            $.ajax({
                url: API + "/register", method: "POST", contentType: "application/json",
                data: JSON.stringify({
                    username: $("#username").val(),
                    email: $("#email").val(),
                    password: $("#password").val()
                }),
                success: login,
                error: x => $("#msg").text(x.responseJSON?.message || "Erro ao cadastrar")
            });
        });
    });
</script>

</html>
